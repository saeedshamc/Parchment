[package]
name = "parchment-app"
version = "0.1.0"
edition = "2021"
description = "Parchment desktop and Android app (Tauri 2)"
license = "MIT"

[lib]
name = "parchment_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
mdr-core = { path = "../../crates/mdr-core", features = ["api"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
